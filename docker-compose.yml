version: '3.8'
services:
  healthcare-agent:
    build: .
    container_name: healthcare-agent-mcp
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - FHIR_URL=${FHIR_URL}
      - FHIR_TOKEN=${FHIR_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"